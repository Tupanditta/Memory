<script>
  (function() {
    const checkboxes = document.querySelectorAll('.person-input');
    const counter = document.getElementById('cohabitants-counter');

    function updateCounter() {
      let selectedCount = 0;
      checkboxes.forEach(input => {
        const item = input.closest('.person-checkbox-item');
        const box = item.querySelector('.checkbox-container');
        if (input.checked) {
          selectedCount++;
          item.classList.add('bg-primary-fixed/20');
          item.classList.remove('bg-surface-container-lowest');
          box.classList.remove('bg-surface-container', 'text-transparent');
          box.classList.add('bg-primary', 'text-on-primary');
        } else {
          item.classList.remove('bg-primary-fixed/20');
          item.classList.add('bg-surface-container-lowest');
          box.classList.add('bg-surface-container', 'text-transparent');
          box.classList.remove('bg-primary', 'text-on-primary');
        }
      });

      if (counter) {
        if (selectedCount === 1) {
          counter.textContent = '1 seleccionado';
          counter.classList.add('text-primary');
        } else if (selectedCount > 1) {
          counter.textContent = selectedCount + ' seleccionados';
          counter.classList.add('text-primary');
        } else {
          counter.textContent = '0 seleccionados';
          counter.classList.remove('text-primary');
        }
      }
    }

    checkboxes.forEach(input => {
      input.addEventListener('change', updateCounter);
    });

    // Simple interaction hint for saving
    const form = document.getElementById('add-home-form');
    if (form) {
      form.addEventListener('submit', function(e) {
        const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
        if (!anyChecked) {
          alert('Por favor, selecciona al menos una persona que viva en este hogar.');
          return false;
        }
      });
    }
  })();
